<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Bad Apple — SIGNAL//VOID</title>
<style>
  * { box-sizing:border-box; }
  html,body { width:100%;height:100%;margin:0;overflow:hidden;background:#000; }
  body { position:fixed;inset:0;user-select:none;-webkit-user-select:none;touch-action:manipulation; }
  #screen { position:absolute;inset:0;width:100%;height:100%;display:block;background:#000; }
  #video { position:fixed;width:1px;height:1px;left:-20px;top:-20px;opacity:0;pointer-events:none; }
</style>
</head>
<body>
<canvas id="screen" aria-label="Bad Apple Signal Void animation"></canvas>
<video id="video" playsinline preload="auto" loop>
  <source src="bad_apple.mp4" type="video/mp4">
</video>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d", { alpha:false });
  const video = document.getElementById("video");
  const raster = document.createElement("canvas");
  const rasterCtx = raster.getContext("2d", { willReadFrequently:true });
  const bayer = [
    [0,8,2,10],
    [12,4,14,6],
    [3,11,1,9],
    [15,7,13,5]
  ];

  let W = 1, H = 1, dpr = 1;
  let stars = [];
  let state = "intro";
  let startTime = 0;
  let clickPoint = { x:0, y:0 };
  let sourceW = 0, sourceH = 0;
  let sourceImage = null, outputImage = null;
  let nativePixelsReady = false;
  let startPromise = null;
  let retryPlayback = false;

  const rand = (a,b) => a + Math.random() * (b-a);
  const clamp = (v,a,b) => Math.max(a,Math.min(b,v));
  const smooth = t => t*t*(3-2*t);

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = Math.max(1,Math.floor(W*dpr));
    canvas.height = Math.max(1,Math.floor(H*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if (state === "intro") createStars();
  }

  function createStars() {
    const count = Math.round(clamp(W*H/1150,360,1050));
    stars = [];
    for (let i=0;i<count;i++) {
      const x = rand(0,W), y = rand(0,H);
      const dx = x-W*0.5, dy = y-H*0.5;
      stars.push({
        x,y,
        radius:rand(0.35,1.65),
        alpha:rand(0.16,0.82),
        phase:rand(0,Math.PI*2),
        twinkle:rand(0.4,2.1),
        angle:Math.atan2(dy,dx),
        orbit:Math.hypot(dx,dy),
        direction:Math.random()<0.5?-1:1,
        lane:rand(12,135),
        drift:rand(0.1,0.7),
        hue:Math.random()<0.19,
        streak:Math.random()<0.12
      });
    }
  }

  function fitRect() {
    const aspect = sourceW && sourceH ? sourceW/sourceH : 4/3;
    const width = Math.min(W,H*aspect);
    const height = width/aspect;
    return { x:(W-width)/2, y:(H-height)/2, width, height };
  }

  function drawIntro(now) {
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,W,H);
    const p = state === "intro" ? 0 : clamp((now-startTime)/1180,0,1);
    const eased = smooth(p);
    const cx = W/2, cy = H/2;
    const elapsed = now*0.001;

    // A quiet orbital anomaly: this start is a moving field, not DOM fragments.
    ctx.save();
    ctx.translate(cx,cy);
    for (let ring=0;ring<5;ring++) {
      const base = Math.min(W,H)*(0.105+ring*0.052);
      const r = base*(1-eased*0.84);
      ctx.beginPath();
      ctx.strokeStyle = "rgba(215,235,255," + ((0.10-ring*0.012)*(1-eased*0.35)) + ")";
      ctx.lineWidth = ring===0 ? 1.2 : 0.6;
      ctx.setLineDash([2+ring*1.7,7+ring*4.3]);
      ctx.lineDashOffset = -elapsed*(ring%2 ? -6 : 5)*(ring+1);
      ctx.ellipse(0,0,r,r*(0.45+ring*0.12),elapsed*(ring%2 ? -0.12 : 0.09),0,Math.PI*2);
      ctx.stroke();
    }
    ctx.setLineDash([]);
    const core = Math.max(1.5,Math.min(W,H)*0.044*(1-eased*0.85));
    const glow = ctx.createRadialGradient(0,0,0,0,0,Math.max(3,core*4.8));
    glow.addColorStop(0,"rgba(235,248,255,"+(0.30*(1-eased*0.3))+")");
    glow.addColorStop(0.24,"rgba(90,145,185,0.12)");
    glow.addColorStop(1,"rgba(10,20,35,0)");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(0,0,Math.max(3,core*4.8),0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle = "rgba(235,247,255,"+(0.62*(1-eased))+")";
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.arc(0,0,core,elapsed*0.8,elapsed*0.8+Math.PI*1.63);
    ctx.stroke();
    ctx.restore();

    // The click sends a shockwave from wherever the user touched.
    if (state === "warping") {
      const age = clamp((now-startTime)/1180,0,1);
      for (let i=0;i<3;i++) {
        const radius = age*Math.hypot(W,H)*0.7-i*26;
        if (radius<0) continue;
        ctx.beginPath();
        ctx.arc(clickPoint.x,clickPoint.y,radius,0,Math.PI*2);
        ctx.strokeStyle = "rgba(210,239,255,"+((1-age)*0.24)+")";
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    }

    for (const star of stars) {
      let x = star.x+Math.sin(elapsed*star.drift+star.phase)*5;
      let y = star.y+Math.cos(elapsed*star.drift*0.8+star.phase)*5;
      let alpha = star.alpha*(0.65+0.35*Math.sin(elapsed*star.twinkle+star.phase));
      let radius = star.radius;
      if (state === "warping") {
        const q = smooth(clamp((now-startTime)/1040,0,1));
        const dx = star.x-cx, dy = star.y-cy;
        const initialR = Math.hypot(dx,dy);
        const angle = star.angle+q*(star.direction*1.7+Math.sin(star.phase)*0.35);
        const targetR = star.lane*(1-q)+Math.min(W,H)*0.018*q;
        const r = initialR*(1-q)+targetR*q;
        x = cx+Math.cos(angle)*r;
        y = cy+Math.sin(angle)*r;
        alpha = star.alpha*(1-q*0.3);
        radius = star.radius*(1+q*1.3);
        const pull = q*q*0.28;
        x += (clickPoint.x-x)*pull;
        y += (clickPoint.y-y)*pull;
      }
      if (x<-3 || y<-3 || x>W+3 || y>H+3) continue;
      ctx.globalAlpha = alpha;
      ctx.fillStyle = star.hue ? "#b4e9ff" : "#e9f4ff";
      if (star.streak && state === "warping") {
        ctx.strokeStyle = ctx.fillStyle;
        ctx.lineWidth = radius*0.7;
        ctx.beginPath();
        ctx.moveTo(x,y);
        ctx.lineTo(x-Math.cos(star.angle)*radius*7,y-Math.sin(star.angle)*radius*7);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(x,y,radius,0,Math.PI*2);
        ctx.fill();
      }
    }
    ctx.globalAlpha = 1;

    if (state === "intro") {
      const pulse = 0.28+0.19*(0.5+0.5*Math.sin(elapsed*1.25));
      ctx.globalAlpha = pulse;
      ctx.fillStyle = "#cfe2f2";
      ctx.font = "10px ui-monospace, SFMono-Regular, Consolas, monospace";
      ctx.textAlign = "center";
      ctx.fillText("TOUCH TO BREAK THE SIGNAL",W/2,H*0.79);
      ctx.globalAlpha = 1;
      const notch = 12+4*Math.sin(elapsed*1.5);
      ctx.fillStyle = "rgba(220,241,255,"+pulse+")";
      ctx.fillRect(cx-notch/2,H*0.79+15,notch,1);
    }
  }

  function setupNativeRaster() {
    if (!video.videoWidth || !video.videoHeight) return;
    sourceW = video.videoWidth;
    sourceH = video.videoHeight;
    // Full-resolution work buffers use exactly the source video's native dimensions.
    raster.width = sourceW;
    raster.height = sourceH;
    sourceImage = rasterCtx.createImageData(sourceW,sourceH);
    outputImage = rasterCtx.createImageData(sourceW,sourceH);
    nativePixelsReady = true;
  }

  function processNativeFrame(now) {
    if (!nativePixelsReady || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA) return;
    rasterCtx.drawImage(video,0,0,sourceW,sourceH);
    sourceImage = rasterCtx.getImageData(0,0,sourceW,sourceH);
    const src = sourceImage.data;
    const out = outputImage.data;
    const time = now*0.001;
    for (let y=0;y<sourceH;y++) {
      const band = Math.sin(y*0.031+time*2.7)*Math.sin(time*0.7);
      const tear = Math.sin(y*0.008-time*1.4)>0.993 ? Math.sin(time*15+y)*3 : 0;
      const shift = Math.round(band*1.45+tear);
      for (let x=0;x<sourceW;x++) {
        const sx = clamp(x+shift,0,sourceW-1);
        const si = (y*sourceW+sx)*4;
        const di = (y*sourceW+x)*4;
        const lum = src[si]*0.2126+src[si+1]*0.7152+src[si+2]*0.0722;
        // Ordered dither on every native source pixel, never a reduced thumbnail.
        const limit = 112+(bayer[y&3][x&3]-7.5)*5.4;
        let value = lum>limit ? 255 : 0;
        if (y%4===0 && value>0) value = 225;
        out[di] = value;
        out[di+1] = value;
        out[di+2] = value;
        out[di+3] = 255;
      }
    }
    rasterCtx.putImageData(outputImage,0,0);
  }

  function drawVideo(now) {
    ctx.fillStyle = "#000";
    ctx.fillRect(0,0,W,H);
    processNativeFrame(now);
    if (!nativePixelsReady) return;
    const rect = fitRect();
    ctx.imageSmoothingEnabled = false;
    ctx.drawImage(raster,rect.x,rect.y,rect.width,rect.height);
    ctx.imageSmoothingEnabled = true;

    ctx.save();
    ctx.beginPath();
    ctx.rect(rect.x,rect.y,rect.width,rect.height);
    ctx.clip();
    ctx.globalAlpha = 0.13;
    ctx.fillStyle = "#000";
    for (let y=rect.y;y<rect.y+rect.height;y+=4) ctx.fillRect(rect.x,y,rect.width,1);
    ctx.globalAlpha = 1;
    const vignette = ctx.createRadialGradient(W/2,H/2,Math.min(rect.width,rect.height)*0.20,W/2,H/2,Math.max(W,H)*0.72);
    vignette.addColorStop(0,"rgba(0,0,0,0)");
    vignette.addColorStop(1,"rgba(0,0,0,0.30)");
    ctx.fillStyle = vignette;
    ctx.fillRect(rect.x,rect.y,rect.width,rect.height);
    ctx.restore();
  }

  function beginVideoPlayback() {
    // The first real tap starts a muted stream immediately to obtain browser permission.
    video.muted = true;
    video.volume = 1;
    try {
      startPromise = video.play();
      if (startPromise && typeof startPromise.then === "function") {
        startPromise.then(() => { retryPlayback = false; }).catch(() => {
          retryPlayback = true;
          startPromise = null;
        });
      }
    } catch (_) {
      retryPlayback = true;
      startPromise = null;
    }
  }

  function start(event) {
    if (state === "intro") {
      const rect = canvas.getBoundingClientRect();
      clickPoint = { x:event ? event.clientX-rect.left : W/2, y:event ? event.clientY-rect.top : H/2 };
      state = "warping";
      startTime = performance.now();
      beginVideoPlayback();
    } else if (retryPlayback) {
      video.muted = false;
      startPromise = video.play();
      retryPlayback = false;
    }
  }
  canvas.addEventListener("pointerdown",start,{passive:true});

  function revealVideo() {
    if (state !== "warping") return;
    state = "video";
    try {
      video.currentTime = 0;
      video.muted = false;
      if (video.paused && retryPlayback) {
        startPromise = video.play();
        retryPlayback = false;
      }
    } catch (_) {}
  }

  function frame(now) {
    if (state === "intro" || state === "warping") {
      drawIntro(now);
      if (state === "warping" && now-startTime >= 1180) revealVideo();
    }
    if (state === "video") drawVideo(now);
    if (state === "video" && video.paused && !retryPlayback) retryPlayback = true;
    requestAnimationFrame(frame);
  }

  video.addEventListener("loadedmetadata",setupNativeRaster);
  video.addEventListener("loadeddata",() => { if (!nativePixelsReady) setupNativeRaster(); });
  video.addEventListener("playing",() => { if (state === "video") video.muted = false; });
  video.addEventListener("error",() => console.error("Could not load bad_apple.mp4 from the repository root."));
  window.addEventListener("resize",resize);

  resize();
  createStars();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
