<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Bad Apple — Afterimage</title>
<style>
  * { box-sizing:border-box; }
  html,body { width:100%;height:100%;margin:0;overflow:hidden;background:#000; }
  body { position:fixed;inset:0;touch-action:manipulation;user-select:none;-webkit-user-select:none; }
  #screen { position:absolute;inset:0;width:100%;height:100%;display:block;background:#000; }
  #video { position:fixed;width:1px;height:1px;left:-20px;top:-20px;opacity:0;pointer-events:none; }
</style>
</head>
<body>
<canvas id="screen" aria-label="Bad Apple Afterimage"></canvas>
<video id="video" playsinline preload="auto" loop>
  <source src="bad_apple.mp4" type="video/mp4">
</video>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("screen");
  const ctx = canvas.getContext("2d", {alpha:false});
  const video = document.getElementById("video");
  const sampler = document.createElement("canvas");
  const sampleCtx = sampler.getContext("2d", {willReadFrequently:true});
  let W=1,H=1,dpr=1,sourceW=0,sourceH=0;
  let state="idle",startedAt=0,clickX=0,clickY=0,particles=[],targetParticles=[];
  let sourceReady=false,targetsReady=false,playRequested=false,playBlocked=false;
  let sourcePixels=null,sourceAspect=4/3,lastRandomGlitch=0,glitchUntil=0;
  let resizeAgain=false;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const easeOut=t=>1-Math.pow(1-t,3);
  const easeInOut=t=>t<0.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

  function resize() {
    dpr=Math.min(window.devicePixelRatio||1,2);
    W=window.innerWidth; H=window.innerHeight;
    canvas.width=Math.max(1,Math.round(W*dpr));
    canvas.height=Math.max(1,Math.round(H*dpr));
    ctx.setTransform(dpr,0,0,dpr,0,0);
    if(state==="idle") makeIdleParticles();
  }

  function frameRect() {
    const aw=W, ah=H, ar=sourceAspect||4/3;
    const width=Math.min(aw,ah*ar), height=width/ar;
    return {x:(W-width)/2,y:(H-height)/2,w:width,h:height};
  }

  function makeIdleParticles() {
    if(state!=="idle") return;
    const count=Math.round(clamp(W*H/1250,420,960));
    particles=[];
    for(let i=0;i<count;i++) {
      const angle=rnd(0,Math.PI*2), ring=rnd(0.05,0.48);
      particles.push({
        x:W*(0.5+Math.cos(angle)*ring),
        y:H*(0.5+Math.sin(angle)*ring),
        fromX:0,fromY:0,toX:0,toY:0,
        size:rnd(0.35,1.7),phase:rnd(0,Math.PI*2),speed:rnd(0.3,1.7),
        orbit:rnd(3,20),direction:Math.random()<0.5?-1:1,
        alpha:rnd(0.16,0.9),hue:Math.random()<0.2
      });
    }
  }

  function prepareNativeFrame() {
    if(!video.videoWidth||!video.videoHeight) return false;
    sourceW=video.videoWidth; sourceH=video.videoHeight; sourceAspect=sourceW/sourceH;
    sampler.width=sourceW; sampler.height=sourceH;
    try {
      sampleCtx.drawImage(video,0,0,sourceW,sourceH);
      sourcePixels=sampleCtx.getImageData(0,0,sourceW,sourceH).data;
      sourceReady=true;
      makeTargets();
      return true;
    } catch(e) {
      sourceReady=false;
      return false;
    }
  }

  function makeTargets() {
    if(!sourcePixels||!sourceW||!sourceH) return;
    const rect=frameRect();
    const count=Math.round(clamp(rect.w*rect.h/115,1200,5200));
    const cols=Math.max(32,Math.round(Math.sqrt(count*sourceAspect)));
    const rows=Math.max(20,Math.ceil(count/cols));
    let dark=0,bright=0;
    // Find the dominant background from the original, full-resolution first frame.
    for(let y=0;y<sourceH;y+=2) {
      for(let x=0;x<sourceW;x+=2) {
        const i=(y*sourceW+x)*4;
        const l=sourcePixels[i]*0.2126+sourcePixels[i+1]*0.7152+sourcePixels[i+2]*0.0722;
        if(l<128) dark++; else bright++;
      }
    }
    const darkIsForeground=dark<bright;
    const targets=[];
    let foregroundSamples=0;
    for(let row=0;row<rows;row++) {
      for(let col=0;col<cols;col++) {
        const px=Math.min(sourceW-1,Math.floor((col+0.5)/cols*sourceW));
        const py=Math.min(sourceH-1,Math.floor((row+0.5)/rows*sourceH));
        const i=(py*sourceW+px)*4;
        const l=sourcePixels[i]*0.2126+sourcePixels[i+1]*0.7152+sourcePixels[i+2]*0.0722;
        const isForeground=darkIsForeground ? l<128 : l>=128;
        if(!isForeground) continue;
        foregroundSamples++;
        targets.push({
          x:rect.x+(col+0.5)/cols*rect.w,
          y:rect.y+(row+0.5)/rows*rect.h,
          lum:l/255,
          row,col
        });
      }
    }
    // If frame zero is almost completely flat, use the strongest local contrast cells.
    // The native source itself remains untouched; this fallback only affects the intro.
    if(targets.length<48) {
      targets.length=0;
      const candidates=[];
      for(let row=0;row<rows;row++) {
        for(let col=0;col<cols;col++) {
          const px=Math.min(sourceW-1,Math.floor((col+0.5)/cols*sourceW));
          const py=Math.min(sourceH-1,Math.floor((row+0.5)/rows*sourceH));
          const i=(py*sourceW+px)*4;
          const l=sourcePixels[i]*0.2126+sourcePixels[i+1]*0.7152+sourcePixels[i+2]*0.0722;
          candidates.push({l,x:rect.x+(col+0.5)/cols*rect.w,y:rect.y+(row+0.5)/rows*rect.h,row,col});
        }
      }
      const average=candidates.reduce((sum,p)=>sum+p.l,0)/Math.max(1,candidates.length);
      if(average>127) {
        // A white opening frame should assemble as a full field, not a random patch.
        for(const p of candidates) targets.push({x:p.x,y:p.y,lum:1,row:p.row,col:p.col});
      } else {
        // If the opening frame is pure black, particles converge and vanish into that black frame.
        const count=Math.min(220,candidates.length);
        for(let i=0;i<count;i++) {
          const angle=(i/count)*Math.PI*2;
          targets.push({
            x:rect.x+rect.w*0.5+Math.cos(angle)*Math.min(rect.w,rect.h)*0.025,
            y:rect.y+rect.h*0.5+Math.sin(angle)*Math.min(rect.w,rect.h)*0.025,
            lum:0,row:Math.floor(i/cols),col:i%cols,fadeOut:true
          });
        }
      }
    }
    // Each bright mark starts elsewhere, then eases into the selected first-frame pixels.
    const n=targets.length;
    targetParticles=[];
    for(let i=0;i<n;i++) {
      const t=targets[i], angle=rnd(0,Math.PI*2);
      const side=Math.random()<0.5?-1:1;
      targetParticles.push({
        x:rnd(-W*0.08,W*1.08), y:rnd(-H*0.08,H*1.08),
        fromX:rnd(-W*0.08,W*1.08),fromY:rnd(-H*0.08,H*1.08),
        toX:t.x,toY:t.y,
        size:rnd(0.85,2.35),
        delay:rnd(0,0.20),
        curve:rnd(-46,46)*side,
        angle,side,
        alpha:rnd(0.55,1),
        hue:Math.random()<0.16,
        lum:t.lum,
        fadeOut:!!t.fadeOut,
        row:t.row,col:t.col
      });
    }
    targetsReady=targetParticles.length>0;
  }

  function drawIdle(now) {
    ctx.fillStyle="#000"; ctx.fillRect(0,0,W,H);
    const t=now*0.001,cx=W/2,cy=H/2,scale=Math.min(W,H);
    const pulse=0.5+0.5*Math.sin(t*1.6);
    const core=scale*(0.018+0.005*pulse);
    // A bright, breathing seed and slow orbit make the page feel alive without any text.
    const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,core*9);
    glow.addColorStop(0,"rgba(240,249,255,"+(0.52+0.12*pulse)+")");
    glow.addColorStop(0.18,"rgba(136,200,255,0.16)");
    glow.addColorStop(1,"rgba(20,48,86,0)");
    ctx.fillStyle=glow; ctx.beginPath();ctx.arc(cx,cy,core*9,0,Math.PI*2);ctx.fill();
    for(let ring=0;ring<3;ring++) {
      const r=scale*(0.052+ring*0.042);
      ctx.beginPath();
      ctx.ellipse(cx,cy,r,r*(0.62+ring*0.07),t*(ring%2?-.15:.11),0,Math.PI*2);
      ctx.strokeStyle="rgba(190,223,255,"+((0.16-ring*0.035)*(0.6+0.4*pulse))+")";
      ctx.lineWidth=0.7;ctx.setLineDash([1.5+ring,8+ring*3]);ctx.lineDashOffset=-t*(6+ring*5);ctx.stroke();
    }
    ctx.setLineDash([]);
    for(const p of particles) {
      const orbitAngle=p.phase+t*p.speed*p.direction;
      const rr=scale*(0.045+0.11*(0.5+0.5*Math.sin(p.phase*1.7+t*0.4)));
      const x=cx+Math.cos(orbitAngle)*rr+Math.sin(t*0.3+p.phase)*p.orbit;
      const y=cy+Math.sin(orbitAngle)*rr*0.62+Math.cos(t*0.35+p.phase)*p.orbit;
      ctx.globalAlpha=p.alpha*(0.55+0.45*Math.sin(t*p.speed+p.phase));
      ctx.fillStyle=p.hue?"#c1eaff":"#eef7ff";
      ctx.beginPath();ctx.arc(x,y,p.size,0,Math.PI*2);ctx.fill();
    }
    ctx.globalAlpha=1;
    // A tiny bright glint travels around the centre, implying the scene is interactive.
    const a=t*0.9;
    const gx=cx+Math.cos(a)*scale*0.095,gy=cy+Math.sin(a)*scale*0.059;
    ctx.fillStyle="rgba(245,252,255,"+(0.45+0.4*pulse)+")";
    ctx.beginPath();ctx.arc(gx,gy,1.4+1.1*pulse,0,Math.PI*2);ctx.fill();
  }

  function start(event) {
    if(state!=="idle") {
      if(playBlocked) retryPlayback();
      return;
    }
    clickX=event.clientX; clickY=event.clientY;
    state="forming";
    startedAt=performance.now();
    // Start a muted video directly inside the trusted tap/click to unlock playback.
    video.muted=true;
    video.volume=1;
    try {
      const promise=video.play();
      if(promise&&typeof promise.then==="function") promise.then(()=>{playBlocked=false;}).catch(()=>{playBlocked=true;});
    } catch(_) { playBlocked=true; }
    if(!targetsReady) {
      if(prepareNativeFrame()) beginFormation();
    } else beginFormation();
  }

  function beginFormation() {
    if(state!=="forming"||!targetsReady||formationStarted) return;
    particles=targetParticles;
    formationStarted=true;
    startedAt=performance.now();
  }
  let formationStarted=false;

  function retryPlayback() {
    video.muted=false;
    video.play().then(()=>{playBlocked=false;}).catch(()=>{playBlocked=true;});
  }

  function drawFormation(now) {
    ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
    const progress=clamp((now-startedAt)/1450,0,1);
    const wave=clamp((now-startedAt)/850,0,1);
    // A shock ring expands from the actual touch point while the particles travel in curved paths.
    if(progress<0.88) {
      const radius=wave*Math.hypot(W,H)*0.56;
      ctx.beginPath();ctx.arc(clickX,clickY,radius,0,Math.PI*2);
      ctx.strokeStyle="rgba(212,238,255,"+((1-wave)*0.36)+")";ctx.lineWidth=1;ctx.stroke();
      ctx.beginPath();ctx.arc(clickX,clickY,Math.max(1,radius-8),0,Math.PI*2);
      ctx.strokeStyle="rgba(124,192,255,"+((1-wave)*0.15)+")";ctx.lineWidth=2;ctx.stroke();
    }
    for(const p of particles) {
      const q=clamp((progress-p.delay)/(1-p.delay),0,1), eased=easeOut(q);
      const dx=p.toX-p.fromX,dy=p.toY-p.fromY;
      const arc=Math.sin(q*Math.PI)*p.curve;
      const x=p.fromX+dx*eased+Math.cos(p.angle)*arc;
      const y=p.fromY+dy*eased+Math.sin(p.angle)*arc;
      const size=p.size*(0.7+0.42*eased);
      const alpha=p.alpha*(0.15+0.85*eased)*(p.fadeOut ? 1-q : 1);
      if(q<0.92&&Math.random()<0.13) {
        ctx.strokeStyle="rgba(193,225,255,"+(alpha*0.19)+")";
        ctx.lineWidth=0.6;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-dx*0.045,y-dy*0.045);ctx.stroke();
      }
      ctx.globalAlpha=alpha;
      ctx.fillStyle=p.hue&&q<0.85?"#b3e9ff":"#fff";
      if(p.row%7===0&&p.col%5===0) {
        ctx.save();ctx.translate(x,y);ctx.rotate((1-q)*p.side*1.5);
        ctx.fillRect(-size*1.8,-size*0.45,size*3.6,size*0.9);ctx.restore();
      } else {
        ctx.fillRect(x-size/2,y-size/2,size,size);
      }
    }
    ctx.globalAlpha=1;
    if(progress>=1) revealVideo();
  }

  function revealVideo() {
    if(state!=="forming") return;
    state="video";
    // Rewind to the actual first frame, then make sound audible.
    try {
      video.currentTime=0;
      video.muted=false;
    } catch(_) {}
    if(video.paused) retryPlayback();
  }

  function drawVideo(now) {
    ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);
    if(video.readyState<HTMLMediaElement.HAVE_CURRENT_DATA||!video.videoWidth) {
      if(targetsReady) drawFormation(now);
      return;
    }
    const rect=frameRect();
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(video,rect.x,rect.y,rect.w,rect.h);
    // Subtle moving signal scanlines; the source movie keeps its native proportions and detail.
    ctx.save();
    ctx.beginPath();ctx.rect(rect.x,rect.y,rect.w,rect.h);ctx.clip();
    ctx.globalAlpha=0.11;ctx.fillStyle="#000";
    const offset=Math.floor(now*0.018)%4;
    for(let y=rect.y+offset;y<rect.y+rect.h;y+=4) ctx.fillRect(rect.x,y,rect.w,1);
    ctx.restore();
    ctx.imageSmoothingEnabled=true;
  }

  function render(now) {
    if(state==="idle") drawIdle(now);
    else if(state==="forming") {
      if(!formationStarted) {
        if(targetsReady) beginFormation();
        else drawIdle(now);
      }
      if(formationStarted) drawFormation(now);
    } else if(state==="video") drawVideo(now);
    requestAnimationFrame(render);
  }

  canvas.addEventListener("pointerdown",start,{passive:true});
  video.addEventListener("loadedmetadata",()=>{
    sourceW=video.videoWidth;sourceH=video.videoHeight;sourceAspect=sourceW/sourceH||4/3;
    if(video.readyState>=HTMLMediaElement.HAVE_CURRENT_DATA) {
      if(state==="idle") prepareNativeFrame();
      else if(state==="forming"&&!formationStarted) {
        video.pause();
        if(video.currentTime>0.001) {
          try { video.currentTime=0; } catch(_) {}
        } else if(prepareNativeFrame()) beginFormation();
      }
    }
  });
  video.addEventListener("loadeddata",()=>{
    if(!sourceReady) {
      // If interaction raced the preload, seek all the way to frame zero before capturing targets.
      if(state==="forming") {
        video.pause();
        if(video.currentTime>0.001) {
          try { video.currentTime=0; } catch(_) {}
          return;
        }
      }
      if(prepareNativeFrame() && state==="forming") beginFormation();
      else if(state==="idle") prepareNativeFrame();
    }
  });
  video.addEventListener("seeked",()=>{
    if(state==="forming"&&!formationStarted&&video.readyState>=HTMLMediaElement.HAVE_CURRENT_DATA) {
      if(prepareNativeFrame()) beginFormation();
    }
  });
  video.addEventListener("error",()=>console.error("Could not load bad_apple.mp4."));

  window.addEventListener("resize",()=>{
    resize();
    if(state==="idle") {
      makeIdleParticles();
      if(sourceReady) makeTargets();
    }
  });
  resize();
  makeIdleParticles();
  requestAnimationFrame(render);
})();
</script>
</body>
</html>
