<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Bad Apple — Windows XP Error</title>
<style>
  * { box-sizing:border-box; }
  html,body { width:100%;height:100%;margin:0;overflow:hidden;background:#000; }
  body { position:fixed;inset:0;font-family:Tahoma,"MS Sans Serif",sans-serif;user-select:none;-webkit-user-select:none;touch-action:manipulation; }
  #popup-layer { position:absolute;inset:0;overflow:hidden;background:#000; }
  #video { position:fixed;width:1px;height:1px;left:-30px;top:-30px;opacity:0;pointer-events:none; }
  #video-canvas { position:absolute;inset:0;display:none;width:100%;height:100%;pointer-events:none; }
  .xp-window {
    position:absolute;display:flex;flex-direction:column;overflow:hidden;
    background:#ece9d8;border:1px solid #08379b;border-radius:3px 3px 1px 1px;
    box-shadow:2px 3px 6px rgba(0,0,0,.72),inset 1px 1px #fff;
    color:#111;font-size:11px;line-height:1.15;
    transition:left 760ms cubic-bezier(.18,.78,.24,1),top 760ms cubic-bezier(.18,.78,.24,1),
      width 760ms cubic-bezier(.18,.78,.24,1),height 760ms cubic-bezier(.18,.78,.24,1),
      opacity 360ms ease,transform 220ms ease;
    will-change:left,top,width,height,opacity;
    transform:translateZ(0);
  }
  .xp-window.tiny { box-shadow:1px 1px 2px #0009; }
  .xp-titlebar {
    display:flex;align-items:center;gap:3px;flex:none;min-width:0;
    height:var(--cap-h,20px);padding:1px 3px 1px 4px;
    color:#fff;font-weight:bold;white-space:nowrap;overflow:hidden;
    background:linear-gradient(180deg,#5aa5f9 0%,#1672e8 9%,#0061e9 48%,#0055df 88%,#3b8df0 100%);
    border-bottom:1px solid #003ba5;text-shadow:1px 1px #164b9a;
  }
  .xp-appicon {
    position:relative;flex:none;width:var(--icon-h,15px);height:var(--icon-h,15px);
    display:grid;place-items:center;border:1px solid #fff8;border-radius:2px;
    background:linear-gradient(135deg,#fff4a4 0%,#e5a32c 42%,#d34820 43%,#a90000 100%);
    color:#fff;font:bold 10px Tahoma,sans-serif;text-shadow:1px 1px #7c1300;
  }
  .xp-title { min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;font-size:var(--title-font,11px); }
  .xp-control {
    flex:none;width:var(--control-w,16px);height:var(--control-h,14px);margin-left:1px;
    display:grid;place-items:center;border:1px solid #fff9;border-radius:2px;
    background:linear-gradient(180deg,#76b6ff,#126be0 52%,#0052ca);
    color:#fff;font: bold var(--control-font,10px) Tahoma,sans-serif;line-height:1;
    box-shadow:inset 1px 1px #ffffff77,inset -1px -1px #194eb6;
  }
  .xp-control.close { background:linear-gradient(180deg,#ffb99c,#f15a3b 40%,#c7190d);box-shadow:inset 1px 1px #fff9,inset -1px -1px #8f170f; }
  .xp-body {
    min-height:0;flex:1;display:flex;align-items:center;gap:var(--body-gap,10px);
    padding:var(--body-pad,10px);overflow:hidden;background:#ece9d8;
  }
  .xp-error-icon {
    flex:none;width:var(--error-size,32px);height:var(--error-size,32px);
    display:grid;place-items:center;border:2px solid #fff9;border-radius:50%;
    background:radial-gradient(circle at 32% 27%,#ffaaa0 0%,#f33a30 38%,#b40000 100%);
    color:#fff;font:bold var(--error-font,26px) Arial,sans-serif;
    text-shadow:1px 1px #8a0000;box-shadow:0 0 0 1px #b00000,inset 1px 1px #ffb6a4;
  }
  .xp-message { min-width:0;flex:1;overflow:hidden;font-size:var(--message-font,11px);line-height:1.3; }
  .xp-footer {
    display:flex;align-items:center;justify-content:flex-end;gap:6px;flex:none;
    height:var(--footer-h,37px);padding:4px 8px 7px;background:#ece9d8;
  }
  .xp-ok {
    min-width:var(--ok-w,72px);height:var(--ok-h,23px);padding:1px 11px;
    border:1px solid #003c74;border-radius:3px;background:linear-gradient(#fff,#f1f0e8 55%,#e0ded3);
    box-shadow:inset 1px 1px #fff,inset -1px -1px #ccc9bd,0 0 0 1px #fff8;
    color:#111;font:var(--button-font,11px) Tahoma,sans-serif;text-align:center;
  }
  .xp-window.micro .xp-body,.xp-window.micro .xp-footer { display:none; }
  .xp-window.micro .xp-titlebar { border-bottom:0; }
  .xp-window.micro .xp-title { font-size:var(--title-font,8px); }
  .xp-window.tiny .xp-appicon { display:none; }
  .xp-window.tiny .xp-control:not(.close) { display:none; }
  #intro-wrap { position:absolute;inset:0;display:grid;place-items:center;z-index:10000;background:transparent;transition:opacity 180ms ease,visibility 180ms ease; }
  #intro-wrap.dismiss { opacity:0;visibility:hidden;pointer-events:none; }
  #intro-window { position:relative;left:auto!important;top:auto!important;width:min(392px,calc(100vw - 30px));height:190px;max-height:calc(100vh - 30px);flex:none; }
  #intro-window .xp-titlebar { height:27px;gap:5px;padding-left:6px; }
  #intro-window .xp-appicon { width:16px;height:16px;font-size:11px; }
  #intro-window .xp-title { font-size:12px; }
  #intro-window .xp-control { width:21px;height:21px;font-size:14px; }
  #intro-window .xp-body { padding:15px 13px 9px;gap:12px; }
  #intro-window .xp-error-icon { width:32px;height:32px;font-size:25px; }
  #intro-window .xp-message { font-size:12px;line-height:1.35; }
  #intro-window .xp-footer { height:43px;padding:5px 12px 9px; }
  #intro-window .xp-ok { width:76px;height:23px;font-size:11px; }
  #popup-layer.morph .xp-window { transition:top 840ms cubic-bezier(.16,.88,.23,1),height 840ms cubic-bezier(.16,.88,.23,1); }
  #popup-layer.playing .xp-window { transition:none !important; }
  @media(max-width:420px) {
    #intro-window { height:178px; }
    #intro-window .xp-body { gap:9px;padding:12px 9px 7px; }
    #intro-window .xp-message { font-size:11px; }
  }
</style>
</head>
<body>
<div id="popup-layer">
  <div id="intro-wrap">
    <div class="xp-window" id="intro-window" role="dialog" aria-label="Windows XP Fehlermeldung">
      <div class="xp-titlebar">
        <span class="xp-appicon">!</span>
        <span class="xp-title">BadApple.exe - Anwendungsfehler</span>
        <span class="xp-control">_</span>
        <span class="xp-control">▢</span>
        <span class="xp-control close">×</span>
      </div>
      <div class="xp-body">
        <span class="xp-error-icon">×</span>
        <div class="xp-message">Die Anweisung bei „0x0041F86A“ verwies auf Speicher bei „0x00000000“. Der Vorgang konnte nicht auf dem Speicher durchgeführt werden.</div>
      </div>
      <div class="xp-footer"><span class="xp-ok">OK</span></div>
    </div>
  </div>
  <canvas id="video-canvas" aria-hidden="true"></canvas>
</div>
<video id="video" playsinline preload="auto" loop>
  <source src="bad_apple.mp4" type="video/mp4">
</video>

<script>
(() => {
  "use strict";
  const layer = document.getElementById("popup-layer");
  const intro = document.getElementById("intro-wrap");
  const video = document.getElementById("video");
  const playbackCanvas = document.getElementById("video-canvas");
  const playbackCtx = playbackCanvas.getContext("2d", {alpha:true, desynchronized:true});
  const popupTextures = {full:[], tiny:[], micro:[], microTiny:[]};
  let canvasScale = 1;
  const MAX_WINDOWS = 240;
  const CELL_FACTOR = 4;
  const THRESHOLD = 127;
  // Bias mixed cells slightly toward keeping thin bright strokes visible as popups.
  const DARK_CELL_RATIO = 0.78;
  const MORPH_HOLD_MS = 1000;
  const MORPH_MS = 840;
  const POPUP_STAGGER_MS = 12;
  const POPUP_FADE_MS = 70;

  const titles = [
    "BadApple.exe - Anwendungsfehler",
    "Windows - Systemfehler",
    "Anwendung reagiert nicht",
    "Programmfehler",
    "Fehlermeldung",
    "BadApple.exe",
    "Microsoft Windows"
  ];
  const messages = [
    "BadApple.exe hat ein Problem festgestellt und muss beendet werden.",
    "Der angegebene Speicherbereich konnte nicht gelesen werden.",
    "Die Anwendung konnte nicht korrekt initialisiert werden (0xc0000135).",
    "Ein unerwarteter Fehler ist aufgetreten. Die Anwendung wird beendet.",
    "Die angeforderte Operation konnte aufgrund eines ungültigen Speicherzugriffs nicht ausgeführt werden.",
    "In BadApple.exe wurde ein Fehler festgestellt. Der Vorgang wurde abgebrochen.",
    "Die Systemressourcen reichen nicht aus, um den Vorgang abzuschließen.",
    "Ein Fehler ist aufgetreten. Die Daten konnten nicht aus dem Speicher gelesen werden."
  ];

  function roundedPath(ctx,x,y,w,h,r) {
    const radius=Math.min(r,w/2,h/2);
    ctx.beginPath();
    ctx.moveTo(x+radius,y);
    ctx.lineTo(x+w-radius,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+radius);
    ctx.lineTo(x+w,y+h-radius);
    ctx.quadraticCurveTo(x+w,y+h,x+w-radius,y+h);
    ctx.lineTo(x+radius,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-radius);
    ctx.lineTo(x,y+radius);
    ctx.quadraticCurveTo(x,y,x+radius,y);
    ctx.closePath();
  }

  function drawTextureControl(ctx,x,y,w,h,label,isClose) {
    const g=ctx.createLinearGradient(0,y,0,y+h);
    if(isClose) {
      g.addColorStop(0,"#ffb99c");g.addColorStop(0.4,"#f15a3b");g.addColorStop(1,"#c7190d");
    } else {
      g.addColorStop(0,"#76b6ff");g.addColorStop(0.52,"#126be0");g.addColorStop(1,"#0052ca");
    }
    roundedPath(ctx,x,y,w,h,2);
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle="#ffffffbb";ctx.lineWidth=1;ctx.stroke();
    ctx.fillStyle="#fff";ctx.font="bold 12px Tahoma,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.fillText(label,x+w/2,y+h/2+0.5);
  }

  function wrapCanvasText(ctx,text,x,y,maxWidth,lineHeight,maxLines) {
    const words=text.split(/\s+/);
    let line="",lineCount=0;
    for(const word of words) {
      const candidate=line?line+" "+word:word;
      if(line && ctx.measureText(candidate).width>maxWidth) {
        ctx.fillText(line,x,y+lineCount*lineHeight);
        line=word;lineCount++;
        if(lineCount>=maxLines) return;
      } else line=candidate;
    }
    if(line && lineCount<maxLines) ctx.fillText(line,x,y+lineCount*lineHeight);
  }

  function createPopupTexture(index,mode) {
    const micro=mode==="micro"||mode==="microTiny";
    const tiny=mode==="tiny"||mode==="microTiny";
    const W=320,H=micro?100:140;
    const titleH=micro?23:32,footerH=micro?0:34;
    const canvas=document.createElement("canvas");
    canvas.width=W;canvas.height=H;
    const ctx=canvas.getContext("2d");
    ctx.clearRect(0,0,W,H);

    ctx.save();
    ctx.shadowColor="rgba(0,0,0,.62)";ctx.shadowBlur=5;ctx.shadowOffsetX=2;ctx.shadowOffsetY=3;
    roundedPath(ctx,2,2,W-4,H-4,4);ctx.fillStyle="#ece9d8";ctx.fill();
    ctx.restore();
    roundedPath(ctx,2,2,W-4,H-4,4);ctx.strokeStyle="#08379b";ctx.lineWidth=2;ctx.stroke();
    ctx.fillStyle="#ece9d8";ctx.fillRect(4,titleH+1,W-8,H-titleH-5);

    const barGradient=ctx.createLinearGradient(0,2,0,titleH+2);
    barGradient.addColorStop(0,"#5aa5f9");barGradient.addColorStop(0.09,"#1672e8");
    barGradient.addColorStop(0.48,"#0061e9");barGradient.addColorStop(0.88,"#0055df");barGradient.addColorStop(1,"#3b8df0");
    ctx.fillStyle=barGradient;ctx.fillRect(3,3,W-6,titleH);
    ctx.fillStyle="#003ba5";ctx.fillRect(3,titleH+2,W-6,1);

    if(!tiny) {
      const iconGradient=ctx.createLinearGradient(7,6,24,23);
      iconGradient.addColorStop(0,"#fff4a4");iconGradient.addColorStop(0.42,"#e5a32c");
      iconGradient.addColorStop(0.43,"#d34820");iconGradient.addColorStop(1,"#a90000");
      roundedPath(ctx,7,Math.max(4,(titleH-17)/2),17,17,2);ctx.fillStyle=iconGradient;ctx.fill();
      ctx.strokeStyle="#ffffffbb";ctx.stroke();
      ctx.fillStyle="#fff";ctx.font="bold 13px Tahoma,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText(["!","×","?","i"][index%4],15.5,titleH/2+1);
    }

    const ctrlY=Math.max(4,(titleH-21)/2),ctrlH=Math.min(21,titleH-6);
    const closeX=W-25;
    drawTextureControl(ctx,closeX,ctrlY,19,ctrlH,"×",true);
    if(!tiny) {
      drawTextureControl(ctx,W-48,ctrlY,19,ctrlH,"▢",false);
      drawTextureControl(ctx,W-71,ctrlY,19,ctrlH,"_",false);
    }
    ctx.save();
    const titleX=tiny?8:29;
    const titleEnd=tiny?W-29:W-75;
    ctx.beginPath();ctx.rect(titleX,3,Math.max(1,titleEnd-titleX),titleH);ctx.clip();
    ctx.fillStyle="#fff";ctx.font="bold 14px Tahoma,sans-serif";ctx.textAlign="left";ctx.textBaseline="middle";
    ctx.shadowColor="#164b9a";ctx.shadowOffsetX=1;ctx.shadowOffsetY=1;ctx.shadowBlur=0;
    ctx.fillText(titles[index%titles.length],titleX,titleH/2+1,Math.max(1,titleEnd-titleX));
    ctx.restore();

    if(!micro) {
      const bodyTop=titleH+3,bodyBottom=H-footerH;
      const midY=bodyTop+(bodyBottom-bodyTop)/2;
      const errorGradient=ctx.createRadialGradient(28,midY-8,2,30,midY,19);
      errorGradient.addColorStop(0,"#ffaaa0");errorGradient.addColorStop(0.38,"#f33a30");errorGradient.addColorStop(1,"#b40000");
      ctx.beginPath();ctx.arc(30,midY,14,0,Math.PI*2);ctx.fillStyle=errorGradient;ctx.fill();
      ctx.strokeStyle="#fff9";ctx.lineWidth=2;ctx.stroke();
      ctx.strokeStyle="#fff";ctx.lineWidth=3;ctx.lineCap="round";
      ctx.beginPath();ctx.moveTo(24,midY-6);ctx.lineTo(36,midY+6);ctx.moveTo(36,midY-6);ctx.lineTo(24,midY+6);ctx.stroke();

      ctx.fillStyle="#111";ctx.font="12px Tahoma,sans-serif";ctx.textAlign="left";ctx.textBaseline="top";
      wrapCanvasText(ctx,messages[(index*3)%messages.length],55,bodyTop+11,W-70,15,3);

      const footerY=H-footerH;
      ctx.fillStyle="#ece9d8";ctx.fillRect(4,footerY,W-8,footerH-4);
      const buttonGradient=ctx.createLinearGradient(0,H-28,0,H-6);
      buttonGradient.addColorStop(0,"#fff");buttonGradient.addColorStop(0.55,"#f1f0e8");buttonGradient.addColorStop(1,"#e0ded3");
      roundedPath(ctx,W-88,H-28,72,22,3);ctx.fillStyle=buttonGradient;ctx.fill();
      ctx.strokeStyle="#003c74";ctx.lineWidth=1;ctx.stroke();
      ctx.strokeStyle="#ffffffaa";ctx.beginPath();ctx.moveTo(W-86,H-26);ctx.lineTo(W-18,H-26);ctx.stroke();
      ctx.fillStyle="#111";ctx.font="11px Tahoma,sans-serif";ctx.textAlign="center";ctx.textBaseline="middle";
      ctx.fillText("OK",W-52,H-17);
    }
    return canvas;
  }

  function buildPopupTextures() {
    const modes=["full","tiny","micro","microTiny"];
    for(const mode of modes) {
      popupTextures[mode]=[];
      for(let i=0;i<16;i++) popupTextures[mode].push(createPopupTexture(i,mode));
    }
  }

  function resizePlaybackCanvas() {
    const W=Math.max(1,window.innerWidth),H=Math.max(1,window.innerHeight);
    canvasScale=Math.min(window.devicePixelRatio||1,2);
    playbackCanvas.width=Math.round(W*canvasScale);
    playbackCanvas.height=Math.round(H*canvasScale);
    playbackCanvas.style.width=W+"px";
    playbackCanvas.style.height=H+"px";
    playbackCtx.setTransform(canvasScale,0,0,canvasScale,0,0);
  }

  function drawPopupTexture(rect,index,alpha) {
    const mode=rect.h<26?(rect.w<52?"microTiny":"micro"):(rect.w<52?"tiny":"full");
    const variants=popupTextures[mode];
    playbackCtx.globalAlpha=alpha===undefined?1:alpha;
    playbackCtx.drawImage(variants[index%variants.length],rect.x,rect.y,Math.max(0.1,rect.w),Math.max(0.1,rect.h));
  }

  function drawPopupBurst(now) {
    const W=window.innerWidth,H=window.innerHeight;
    playbackCtx.clearRect(0,0,W,H);
    for(const item of burstWindows) {
      if(now<item.showAt) continue;
      const alpha=clamp((now-item.showAt)/POPUP_FADE_MS,0,1);
      drawPopupTexture(item,item.index,alpha);
    }
    playbackCtx.globalAlpha=1;
  }

  function drawPopupCollapse(now) {
    const W=window.innerWidth,H=window.innerHeight;
    playbackCtx.clearRect(0,0,W,H);
    const progress=clamp((now-morphStartTime)/MORPH_MS,0,1);
    const eased=1-Math.pow(1-progress,3);
    for(const item of burstWindows) {
      if(now<item.showAt+POPUP_FADE_MS) continue;
      const h=item.h*(1-eased);
      drawPopupTexture({x:item.x,y:item.y+(item.h-h)/2,w:item.w,h},item.index,1);
    }
    playbackCtx.globalAlpha=1;
  }

  function drawPlaybackTiles(tiles) {
    const W=window.innerWidth,H=window.innerHeight;
    playbackCtx.clearRect(0,0,W,H);
    for(let i=0;i<tiles.length;i++) drawPopupTexture(tiles[i],i,1);
    playbackCtx.globalAlpha=1;
  }

  let state = "intro";
  let sourceW = 0, sourceH = 0;
  let frameRect = {x:0,y:0,w:1,h:1};
   let windows = [];
  let burstWindows = [];
  let morphStartTime = 0;
  let audioContext = null, audioGain = null, audioSource = null;
  let playbackPrimed = false;
  let layoutBusy = false;
  let lastUpdate = 0;
  let animationId = 0;
  let startTimer = 0;
  let morphTimer = 0;
  let startedByGesture = false;

  const rand = (min,max) => min + Math.random() * (max-min);
  const choose = list => list[Math.floor(Math.random()*list.length)];
  const clamp = (v,min,max) => Math.max(min,Math.min(max,v));

  function getFrameRect() {
    const W = window.innerWidth, H = window.innerHeight;
    const aspect = sourceW && sourceH ? sourceW/sourceH : 4/3;
    const w = Math.min(W,H*aspect), h = w/aspect;
    return {x:(W-w)/2,y:(H-h)/2,w,h};
  }

  function createXpWindow(index) {
    const win = document.createElement("div");
    win.className = "xp-window";
    win.style.opacity = "0";
    win.style.left = "0px";
    win.style.top = "0px";
    win.style.width = "160px";
    win.style.height = "90px";
    const capH = rand(15,22);
    const iconH = Math.max(8,capH-5);
    win.style.setProperty("--cap-h",capH+"px");
    win.style.setProperty("--icon-h",iconH+"px");
    win.style.setProperty("--title-font",rand(7.2,10.5)+"px");
    win.style.setProperty("--control-w",Math.max(10,capH*0.74)+"px");
    win.style.setProperty("--control-h",Math.max(9,capH*0.68)+"px");
    win.style.setProperty("--control-font",Math.max(6,capH*0.52)+"px");

    const titlebar = document.createElement("div");
    titlebar.className = "xp-titlebar";
    const appIcon = document.createElement("span");
    appIcon.className = "xp-appicon";
    appIcon.textContent = choose(["!","×","?","i"]);
    const title = document.createElement("span");
    title.className = "xp-title";
    title.textContent = choose(titles);
    const minimize = document.createElement("span");
    minimize.className = "xp-control";
    minimize.textContent = "_";
    const maximize = document.createElement("span");
    maximize.className = "xp-control";
    maximize.textContent = "▢";
    const close = document.createElement("span");
    close.className = "xp-control close";
    close.textContent = "×";
    titlebar.append(appIcon,title,minimize,maximize,close);

    const body = document.createElement("div");
    body.className = "xp-body";
    const icon = document.createElement("span");
    icon.className = "xp-error-icon";
    icon.textContent = "×";
    const message = document.createElement("div");
    message.className = "xp-message";
    message.textContent = choose(messages);
    body.append(icon,message);

    const footer = document.createElement("div");
    footer.className = "xp-footer";
    const ok = document.createElement("span");
    ok.className = "xp-ok";
    ok.textContent = "OK";
    footer.append(ok);
    win.append(titlebar,body,footer);
    win.dataset.index = String(index);
    return win;
  }

  function styleWindowForRect(win,x,y,w,h) {
    const ww = Math.max(1,w), hh = Math.max(1,h);
    win.style.left = x+"px";
    win.style.top = y+"px";
    win.style.width = ww+"px";
    win.style.height = hh+"px";
    const cap = clamp(hh*0.23,5,21);
    const controlW = clamp(ww*0.075,5,16);
    win.style.setProperty("--cap-h",cap+"px");
    win.style.setProperty("--icon-h",clamp(cap-5,4,15)+"px");
    win.style.setProperty("--control-w",controlW+"px");
    win.style.setProperty("--control-h",clamp(cap-5,4,14)+"px");
    win.style.setProperty("--control-font",clamp(cap*0.55,4,10)+"px");
    win.style.setProperty("--title-font",clamp(Math.min(ww*0.055,cap*0.55),4,10.5)+"px");
    win.style.setProperty("--message-font",clamp(Math.min(ww*0.048,hh*0.14),4,11)+"px");
    win.style.setProperty("--error-size",clamp(Math.min(hh*0.36,ww*0.18),5,32)+"px");
    win.style.setProperty("--error-font",clamp(hh*0.29,5,25)+"px");
    win.style.setProperty("--body-gap",clamp(ww*0.03,2,10)+"px");
    win.style.setProperty("--body-pad",clamp(Math.min(ww,hh)*0.045,1,10)+"px");
    win.style.setProperty("--footer-h",clamp(hh*0.24,5,37)+"px");
    win.style.setProperty("--ok-w",clamp(ww*0.22,9,72)+"px");
    win.style.setProperty("--ok-h",clamp(hh*0.17,5,23)+"px");
    win.style.setProperty("--button-font",clamp(hh*0.09,4,11)+"px");
    win.classList.toggle("micro",hh<26);
    win.classList.toggle("tiny",ww<52);
  }

  function makePopupBurst() {
    layer.classList.remove("morph","playing");
    layer.classList.add("burst");
    resizePlaybackCanvas();
    playbackCanvas.style.display="block";
    const W=window.innerWidth,H=window.innerHeight;
    const startedAt=performance.now();
    burstWindows=[];
    windows=[];
    // Draw cached popup images on a single canvas rather than creating thousands of DOM elements.
    for(let i=0;i<MAX_WINDOWS;i++) {
      const w=rand(105,Math.min(310,Math.max(130,W*0.45)));
      const h=rand(54,Math.min(150,Math.max(78,H*0.28)));
      burstWindows.push({
        x:rand(-w*0.08,Math.max(0,W-w*0.92)),
        y:rand(-h*0.08,Math.max(0,H-h*0.92)),
        w,h,index:i,showAt:startedAt+i*POPUP_STAGGER_MS
      });
    }
    drawPopupBurst(startedAt);
    return (MAX_WINDOWS-1)*POPUP_STAGGER_MS+POPUP_FADE_MS+20;
  }

   function buildBaseMask(rgba,sw,sh,gw,gh) {
    const mask = new Uint8Array(gw*gh);
    for(let gy=0;gy<gh;gy++) {
      const sy0 = Math.floor(gy*sh/gh);
      const sy1 = Math.max(sy0+1,Math.ceil((gy+1)*sh/gh));
      for(let gx=0;gx<gw;gx++) {
        const sx0 = Math.floor(gx*sw/gw);
        const sx1 = Math.max(sx0+1,Math.ceil((gx+1)*sw/gw));
        let darkCount = 0;
        let sampleCount = 0;
        for(let sy=sy0;sy<sy1;sy++) {
          let p=(sy*sw+sx0)*4;
          for(let sx=sx0;sx<sx1;sx++,p+=4) {
            const lum=rgba[p]*0.2126+rgba[p+1]*0.7152+rgba[p+2]*0.0722;
            if(lum<THRESHOLD) darkCount++;
            sampleCount++;
          }
        }
        // A single dark edge pixel no longer swallows a whole thin bright stripe.
        mask[gy*gw+gx]=(darkCount/Math.max(1,sampleCount)>=DARK_CELL_RATIO)?1:0;
      }
    }
    return mask;
  }

  function downsampleMask(base,bw,bh,nw,nh) {
    const reduced=new Uint8Array(nw*nh);
    for(let y=0;y<nh;y++) {
      const y0=Math.floor(y*bh/nh),y1=Math.max(y0+1,Math.ceil((y+1)*bh/nh));
      for(let x=0;x<nw;x++) {
        const x0=Math.floor(x*bw/nw),x1=Math.max(x0+1,Math.ceil((x+1)*bw/nw));
        let darkCount=0,total=0;
        for(let yy=y0;yy<y1;yy++) {
          for(let xx=x0;xx<x1;xx++) {
            darkCount+=base[yy*bw+xx];
            total++;
          }
        }
        // Fractional coverage avoids the old OR+dilation step swallowing narrow bright gaps.
        reduced[y*nw+x]=(darkCount/Math.max(1,total)>=DARK_CELL_RATIO)?1:0;
      }
    }
    return reduced;
  }

  function mergeRects(input) {
    let rects=input;
    for(let pass=0;pass<18;pass++) {
      let changed=false;
      const rowMap=new Map();
      for(const r of rects) {
        const key=r.y0+":"+r.y1;
        if(!rowMap.has(key)) rowMap.set(key,[]);
        rowMap.get(key).push(r);
      }
      let horiz=[];
      for(const row of rowMap.values()) {
        row.sort((a,b)=>a.x0-b.x0);
        let cur=row[0];
        for(let i=1;i<row.length;i++) {
          const next=row[i];
          if(cur.x1===next.x0) { cur={x0:cur.x0,y0:cur.y0,x1:next.x1,y1:cur.y1};changed=true; }
          else { horiz.push(cur);cur=next; }
        }
        if(cur) horiz.push(cur);
      }
      const colMap=new Map();
      for(const r of horiz) {
        const key=r.x0+":"+r.x1;
        if(!colMap.has(key)) colMap.set(key,[]);
        colMap.get(key).push(r);
      }
      const vertical=[];
      for(const col of colMap.values()) {
        col.sort((a,b)=>a.y0-b.y0);
        let cur=col[0];
        for(let i=1;i<col.length;i++) {
          const next=col[i];
          if(cur.y1===next.y0) { cur={x0:cur.x0,y0:cur.y0,x1:cur.x1,y1:next.y1};changed=true; }
          else { vertical.push(cur);cur=next; }
        }
        if(cur) vertical.push(cur);
      }
      rects=vertical;
      if(!changed) break;
    }
    return rects;
  }

  function partitionMask(mask,w,h) {
    const stride=w+1;
    const integral=new Uint32Array((w+1)*(h+1));
    for(let y=0;y<h;y++) {
      let rowSum=0;
      for(let x=0;x<w;x++) {
        rowSum+=mask[y*w+x];
        integral[(y+1)*stride+x+1]=integral[y*stride+x+1]+rowSum;
      }
    }
    function sum(x0,y0,x1,y1) {
      return integral[y1*stride+x1]-integral[y0*stride+x1]-integral[y1*stride+x0]+integral[y0*stride+x0];
    }
    const result=[];
    const stack=[[0,0,w,h]];
    while(stack.length) {
      const item=stack.pop();
      const x0=item[0],y0=item[1],x1=item[2],y1=item[3];
      const rw=x1-x0,rh=y1-y0;
      if(rw<=0||rh<=0) continue;
      const occupied=sum(x0,y0,x1,y1);
      const area=rw*rh;
      if(occupied===0) { result.push({x0,y0,x1,y1});continue; }
      if(occupied>=area) continue;
      if(rw===1&&rh===1) continue;
      if(rw>1&&rh>1) {
        const xm=x0+Math.floor(rw/2),ym=y0+Math.floor(rh/2);
        stack.push([x0,y0,xm,ym],[xm,y0,x1,ym],[x0,ym,xm,y1],[xm,ym,x1,y1]);
      } else if(rw>1) {
        const xm=x0+Math.floor(rw/2);
        stack.push([x0,y0,xm,y1],[xm,y0,x1,y1]);
      } else {
        const ym=y0+Math.floor(rh/2);
        stack.push([x0,y0,x1,ym],[x0,ym,x1,y1]);
      }
    }
    return mergeRects(result);
  }

  function makeTiles(rgba, windowLimit = MAX_WINDOWS) {
    if(!sourceW||!sourceH||!rgba) return [];
    windowLimit = Math.max(1,Math.min(MAX_WINDOWS,windowLimit));
    frameRect=getFrameRect();
    let gw=Math.max(8,Math.ceil(frameRect.w/CELL_FACTOR));
    let gh=Math.max(8,Math.ceil(frameRect.h/CELL_FACTOR));
    const base=buildBaseMask(rgba,sourceW,sourceH,gw,gh);
    let w=gw,h=gh,working=base,rects=[];
    for(let attempt=0;attempt<26;attempt++) {
      rects=partitionMask(working,w,h);
      if(rects.length<=windowLimit) break;
      const ratio=Math.sqrt(windowLimit/Math.max(1,rects.length))*0.90;
      let nw=Math.max(5,Math.min(w-1,Math.floor(w*ratio)));
      let nh=Math.max(5,Math.min(h-1,Math.floor(h*ratio)));
      if(nw===w&&nh===h) {
        if(w>=h&&w>5) nw--;
        else if(h>5) nh--;
        else break;
      }
      w=nw;h=nh;
      working=downsampleMask(base,gw,gh,w,h);
    }
    rects.sort((a,b)=>a.y0-b.y0||a.x0-b.x0);
    return rects.slice(0,windowLimit).map(r=>({
      x:frameRect.x+r.x0/w*frameRect.w,
      y:frameRect.y+r.y0/h*frameRect.h,
      w:(r.x1-r.x0)/w*frameRect.w,
      h:(r.y1-r.y0)/h*frameRect.h
    })).filter(r=>r.w>1&&r.h>1);
  }

  function prepareAudioFromGesture() {
    try {
      const AudioCtx=window.AudioContext||window.webkitAudioContext;
      if(AudioCtx) {
        if(!audioContext) {
          audioContext=new AudioCtx();
          audioGain=audioContext.createGain();
          audioGain.gain.value=0;
          audioSource=audioContext.createMediaElementSource(video);
          audioSource.connect(audioGain);
          audioGain.connect(audioContext.destination);
        }
        audioContext.resume().catch(()=>{});
        video.muted=false;
        video.volume=1;
        const p=video.play();
        if(p&&typeof p.then==="function") {
          p.then(()=>{
            playbackPrimed=true;
            video.pause();
            try { video.currentTime=0; } catch(_) {}
          }).catch(()=>{ playbackPrimed=false; });
        }
      } else {
        video.muted=true;
        const p=video.play();
        if(p&&typeof p.then==="function") p.then(()=>{
          playbackPrimed=true;video.pause();
          try {video.currentTime=0;}catch(_){}
        }).catch(()=>{});
      }
    } catch(error) {
      video.muted=true;
      try { video.play().then(()=>{playbackPrimed=true;video.pause();try{video.currentTime=0;}catch(_){}}).catch(()=>{}); } catch(_) {}
    }
  }

  function begin() {
    if(state!=="intro") return;
    state="burst";
    startedByGesture=true;
    intro.classList.add("dismiss");
    const popupRevealDuration = makePopupBurst();
    prepareAudioFromGesture();
    // Start the one-second pause after the final error popup has appeared.
    startTimer=window.setTimeout(() => {
      startTimer=window.setTimeout(startMorph,MORPH_HOLD_MS);
    }, popupRevealDuration);
  }

  function setWindowRect(win,rect,visible) {
    if(visible) {
      styleWindowForRect(win,rect.x,rect.y,rect.w,rect.h);
      win.style.opacity="1";
    } else {
      const cx=frameRect.x+frameRect.w/2,cy=frameRect.y+frameRect.h/2;
      styleWindowForRect(win,cx,cy,2,2);
      win.style.opacity="0";
    }
  }

  function ensureWindowCount(count) {
    const W=window.innerWidth,H=window.innerHeight;
    while(windows.length<count && windows.length<MAX_WINDOWS) {
      const win=createXpWindow(windows.length);
      win.style.transition="none";
      win.style.opacity="0";
      styleWindowForRect(win,W/2,H/2,2,2);
      layer.appendChild(win);
      windows.push(win);
    }
  }

  function startMorph() {
    if(state!=="burst") return;
    state="morph";
    layer.classList.remove("burst");
    layer.classList.add("morph");
    morphStartTime=performance.now();
    // Each cached popup shrinks vertically around its own centre line.
    morphTimer=window.setTimeout(startMovie,MORPH_MS+30);
  }

  function startMovie() {
    if(state!=="morph") return;
    // Swap hundreds of live DOM windows for a single canvas at playback time.
    for(const win of windows) win.remove();
    windows=[];
    state="playing";
    layer.classList.remove("morph");
    layer.classList.add("playing");
    resizePlaybackCanvas();
    playbackCanvas.style.display="block";
    try {
      video.pause();
      video.currentTime=0;
    } catch(_) {}
    if(audioContext&&audioGain) {
      audioContext.resume().catch(()=>{});
      audioGain.gain.cancelScheduledValues(audioContext.currentTime);
      audioGain.gain.setTargetAtTime(1,audioContext.currentTime,0.075);
      video.muted=false;
    } else {
      video.muted=false;
      video.volume=1;
    }
    try {
      const p=video.play();
      if(p&&typeof p.catch==="function") p.catch(()=>{ video.muted=true; });
    } catch(_) { video.muted=true; }
    lastUpdate=0;
  }

   function updateFromCurrentFrame(now) {
    if(state!=="playing"||now-lastUpdate<55||layoutBusy||!video.videoWidth) return;
    lastUpdate=now;
    layoutBusy=true;
    const sampler=updateFromCurrentFrame.canvas||(updateFromCurrentFrame.canvas=document.createElement("canvas"));
    if(sampler.width!==sourceW||sampler.height!==sourceH) {
      sampler.width=sourceW;sampler.height=sourceH;
    }
    const c=sampler.getContext("2d",{willReadFrequently:true});
    try {
      c.drawImage(video,0,0,sourceW,sourceH);
      const data=c.getImageData(0,0,sourceW,sourceH).data;
      const tiles=makeTiles(data,MAX_WINDOWS);
      drawPlaybackTiles(tiles);
    } catch(error) {
      console.error("Could not update popup layout.",error);
    } finally {
      layoutBusy=false;
    }
  }

  function onPointerDown() {
    if(state==="intro") begin();
    else if(state==="playing"&&video.paused) {
      try { video.play(); } catch(_) {}
    }
  }

  function tick(now) {
    if(state==="burst") drawPopupBurst(now);
    else if(state==="morph") drawPopupCollapse(now);
    else if(state==="playing") updateFromCurrentFrame(now);
    requestAnimationFrame(tick);
  }

  document.addEventListener("pointerdown",onPointerDown,{passive:true});
  video.addEventListener("loadedmetadata",()=>{
    sourceW=video.videoWidth;sourceH=video.videoHeight;frameRect=getFrameRect();
  });
   video.addEventListener("error",()=>console.error("bad_apple.mp4 could not be loaded from the repository root."));
  window.addEventListener("resize",()=>{
    frameRect=getFrameRect();
    if(state==="playing") resizePlaybackCanvas();
    if(state==="intro") {
      const win=document.getElementById("intro-window");
      if(win) win.style.width="min(392px,calc(100vw - 30px))";
    }
  });

  buildPopupTextures();
  resizePlaybackCanvas();
  requestAnimationFrame(tick);
})();
</script>
