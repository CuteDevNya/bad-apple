<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Bad Apple – zufällige Seite</title>
</head>
<body>
<script>
(async () => {
  // Die Git-Tree-API findet HTML-Seiten auch in Unterordnern.
  // Nur diese index.html wird ausgeschlossen, damit keine Weiterleitungsschleife entsteht.
  const fallbackPage = "badapple-elements.html";
  try {
    const response = await fetch(
      "https://api.github.com/repos/CuteDevNya/bad-apple/git/trees/main?recursive=1",
      { headers: { Accept: "application/vnd.github+json" }, cache: "no-store" }
    );
    if (!response.ok) throw new Error("GitHub API antwortete mit " + response.status);

    const result = await response.json();
    const pages = (result.tree || [])
      .filter(item =>
        item.type === "blob" &&
        /\.html?$/i.test(item.path) &&
        item.path.toLowerCase() !== "index.html"
      )
      .map(item => item.path);

    if (!pages.length) throw new Error("Keine auswählbaren HTML-Seiten gefunden");

    const selectedPage = pages[Math.floor(Math.random() * pages.length)];
    const encodedPath = selectedPage.split("/").map(encodeURIComponent).join("/");
    window.location.replace(new URL(encodedPath, window.location.href).href);
  } catch (error) {
    // Funktioniert auch dann weiter, wenn die API vorübergehend nicht erreichbar ist.
    window.location.replace(new URL(fallbackPage, window.location.href).href);
  }
})();
</script>
</body>
</html>
