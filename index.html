<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Bad Apple — Random</title>
<style>
  html,body { width:100%;height:100%;margin:0;overflow:hidden;background:#000; }
  #page { display:block;width:100%;height:100%;border:0;background:#000; }
</style>
</head>
<body>
<iframe id="page" title="Bad Apple" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script>
(() => {
  "use strict";
  const pages = [
    "badapple-elements.html",
    "badapple-xp-popups.html",
    "badapple-origami-flock.html"
  ];
  const key = "badAppleExperienceShuffleV6";
  const frame = document.getElementById("page");
  let previous = "";
  try { previous = localStorage.getItem(key) || ""; } catch (_) {}

  // Select randomly from the original, XP-popup and origami-flock experiences.
  // Prefer a different page than last time so the experiences take turns.
  let choices = pages.filter(path => path !== previous);
  if (!choices.length) choices = pages;
  let index;
  if (window.crypto && window.crypto.getRandomValues) {
    const value = new Uint32Array(1);
    window.crypto.getRandomValues(value);
    index = value[0] % choices.length;
  } else {
    index = Math.floor(Math.random() * choices.length);
  }

  const selected = choices[index];
  try { localStorage.setItem(key, selected); } catch (_) {}
  frame.src = selected + "?v=" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
})();
</script>
</body>
</html>
