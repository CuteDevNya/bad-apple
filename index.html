<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050505">
<title>Bad Apple</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;
    background: #050505;
  }
  body {
    position: fixed;
    inset: 0;
    color: white;
    font-family: system-ui, sans-serif;
    user-select: none;
  }
  #visual {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    overflow: hidden;
    background: #050505;
  }
  /* This frame follows the video's aspect ratio and is always centered. */
  #frame {
    position: relative;
    flex: none;
    overflow: hidden;
    background: #050505;
    isolation: isolate;
  }
  .piece {
    position: absolute;
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 0;
    padding: 0;
    min-width: 0;
    min-height: 0;
    max-width: none;
    max-height: none;
    overflow: hidden;
    line-height: 1;
    white-space: nowrap;
    text-overflow: clip;
    transform-origin: center center;
    pointer-events: none;
    opacity: 0;
    will-change: transform, opacity;
    contain: layout style paint;
    appearance: none;
  }
  .piece > * {
    min-width: 0;
    min-height: 0;
    max-width: 100%;
    max-height: 100%;
    margin: 0;
    overflow: hidden;
    line-height: 1;
    white-space: nowrap;
    box-sizing: border-box;
  }
  .piece table { width: 100%; height: 100%; border-collapse: collapse; font: inherit; }
  .piece td, .piece th { padding: 1px; border: 1px solid currentColor; }
  .piece ul, .piece ol { padding-left: 8px; margin: 0; }
  .piece fieldset { min-width: 0; padding: 1px; }
  .piece img { width: 100%; height: 100%; object-fit: contain; }
  #video {
    position: fixed;
    width: 1px;
    height: 1px;
    left: -10px;
    top: -10px;
    opacity: 0;
    pointer-events: none;
  }
  #audioGate {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: none;
    place-items: center;
    pointer-events: none;
  }
  #audioGate.visible { display: grid; }
  #startButton {
    pointer-events: auto;
    appearance: none;
    border: 1px solid #ffffff6b;
    border-radius: 999px;
    padding: 13px 19px;
    background: #101014d9;
    color: #fff;
    font: 650 14px/1.2 system-ui, sans-serif;
    letter-spacing: .01em;
    box-shadow: 0 6px 32px #0008;
    backdrop-filter: blur(10px);
    cursor: pointer;
  }
  #startButton:hover { background: #292932ee; }
  #missing {
    position: fixed;
    z-index: 6;
    left: 50%;
    bottom: 18px;
    transform: translateX(-50%);
    display: none;
    max-width: calc(100vw - 28px);
    padding: 9px 13px;
    color: #d7d7df;
    background: #17171de8;
    border: 1px solid #ffffff22;
    border-radius: 10px;
    font: 12px/1.4 system-ui, sans-serif;
    text-align: center;
  }
</style>
</head>
<body>
  <main id="visual" aria-label="Bad Apple animation">
    <div id="frame" aria-hidden="true"></div>
  </main>
  <video id="video" playsinline preload="auto" loop></video>
  <div id="audioGate" role="dialog" aria-label="Wiedergabe starten">
    <button id="startButton" type="button">▶ Start Bad Apple mit Ton</button>
  </div>
  <div id="missing">Videodatei nicht gefunden. Lege <b>bad_apple.mp4</b> neben die index.html ins Repository.</div>

<script>
(() => {
  "use strict";
  const visual = document.getElementById("visual");
  const frame = document.getElementById("frame");
  const video = document.getElementById("video");
  const gate = document.getElementById("audioGate");
  const startButton = document.getElementById("startButton");
  const missing = document.getElementById("missing");

  const videoFiles = [
    "bad_apple.mp4",
    "bad-apple.mp4",
    "badapple.mp4",
    "Bad Apple.mp4",
    "Bad_Apple.mp4",
    "video.mp4"
  ];

  // Every item is an actual HTML tag. The number is deliberately capped to
  // keep animation smooth instead of creating thousands of DOM nodes.
  const elementTags = [
    "button", "input", "textarea", "a", "h1", "h2", "h3", "p", "span",
    "div", "progress", "meter", "hr", "select", "label", "small", "code",
    "pre", "blockquote", "table", "kbd", "mark", "output", "ul", "ol",
    "li", "summary", "samp", "strong", "em", "del", "ins", "sup", "sub",
    "fieldset", "legend", "article", "aside", "nav", "header", "footer",
    "section", "figure", "figcaption", "time", "data", "var", "cite", "q",
    "address", "dl", "dt", "dd", "ruby", "bdi", "abbr", "dfn", "u", "s",
    "i", "b", "form", "details", "menu", "main"
  ];
  const colors = [
    "#f8f8fc", "#e6e7ee", "#c9cbd6", "#aeb2c2", "#f3b8df",
    "#c3ceff", "#a7eddf", "#f5d6a5", "#d2bcff", "#a8dafa",
    "#e6f2b4", "#f5a8ae", "#b5b7ff", "#9fe5ed", "#fff0f7"
  ];
  const textBits = [
    "BAD", "APPLE", "01", "OK", "BTN", "0x", "404", "HI", "?!", "///",
    "✦", "♡", "◌", "→", "☻", "GO", "null", "true", "false", "△", "###",
    "CLICK", "TEXT", "on", "off", "0101", "✧", "{}", "()", "[]", "★", "≋"
  ];
  const borderStyles = ["solid", "solid", "dashed", "dotted", "double", "none"];
  const inputTypes = ["text", "button", "checkbox", "submit", "search", "radio", "range"];

  let sourceIndex = 0;
  let started = false;
  let foregroundIsDark = true;
  let pieces = [];
  let animationToken = 0;
  let lastVideoTime = -1;
  let resizeTimer = 0;
  let frameWidth = 0;
  let frameHeight = 0;
  let sampleWidth = 0;
  let sampleHeight = 0;
  let luminance = new Uint8Array(0);

  const sampler = document.createElement("canvas");
  const context = sampler.getContext("2d", { willReadFrequently: true });

  const choose = array => array[Math.floor(Math.random() * array.length)];
  const rand = (min, max) => min + Math.random() * (max - min);
  const clamp = (value, min, max) => Math.max(min, Math.min(max, value));

  function showGate(text) {
    startButton.textContent = text;
    gate.classList.add("visible");
  }
  function hideGate() {
    gate.classList.remove("visible");
  }
  function loadNextVideo() {
    if (sourceIndex >= videoFiles.length) {
      missing.style.display = "block";
      showGate("Videodatei fehlt");
      startButton.disabled = true;
      startButton.style.cursor = "default";
      return;
    }
    video.src = videoFiles[sourceIndex++];
    video.load();
  }

  function makeElement(tag, x, y, cellWidth, cellHeight) {
    const element = document.createElement(tag);
    element.className = "piece";
    element.setAttribute("aria-hidden", "true");

    // Random size and scattered position are fixed for the entire video.
    // The silhouette controls only visibility, scale and contour rotation.
    const width = cellWidth * rand(0.42, 1.42);
    const height = cellHeight * rand(0.40, 1.35);
    element.style.left = x.toFixed(3) + "px";
    element.style.top = y.toFixed(3) + "px";
    element.style.width = width.toFixed(2) + "px";
    element.style.height = height.toFixed(2) + "px";

    const bg = choose(colors);
    const fg = Math.random() < 0.2 ? choose(colors) : "#101116";
    const border = choose(colors);
    const style = element.style;
    style.background = Math.random() < 0.15 ? "transparent" : bg;
    style.color = fg;
    style.border = rand(0, 2).toFixed(1) + "px " + choose(borderStyles) + " " + border;
    style.borderRadius = Math.random() < 0.7
      ? rand(0, 9).toFixed(1) + "px"
      : rand(20, 50).toFixed(0) + "%";
    style.fontFamily = choose(["Arial, sans-serif", "Georgia, serif", "monospace", "system-ui, sans-serif"]);
    style.fontSize = rand(7, 15).toFixed(1) + "px";
    style.fontWeight = choose(["400", "500", "650", "800", "900"]);
    style.fontStyle = Math.random() < 0.18 ? "italic" : "normal";
    style.textDecoration = Math.random() < 0.16 ? "underline" : "none";
    style.letterSpacing = rand(-0.5, 1.8).toFixed(1) + "px";
    style.textAlign = "center";
    style.outline = Math.random() < 0.1 ? "1px solid " + border : "none";
    style.boxShadow = Math.random() < 0.18
      ? "0 0 " + rand(1, 5).toFixed(1) + "px " + border + "66"
      : "none";
    style.appearance = "none";

    if (tag === "input") {
      const type = choose(inputTypes);
      element.type = type;
      if (type === "button" || type === "submit") element.value = choose(textBits);
      else if (type === "checkbox" || type === "radio") element.checked = Math.random() < 0.5;
      else if (type === "range") {
        element.value = String(Math.floor(rand(0, 100)));
        element.min = "0";
        element.max = "100";
      } else {
        element.value = choose(textBits);
        element.placeholder = choose(textBits);
      }
    } else if (tag === "textarea") {
      element.rows = 1;
      element.cols = 4;
      element.value = choose(textBits);
    } else if (tag === "select") {
      for (let i = 0; i < 2; i++) {
        const option = document.createElement("option");
        option.textContent = choose(textBits);
        element.appendChild(option);
      }
    } else if (tag === "progress") {
      element.max = 100;
      element.value = rand(0, 100);
    } else if (tag === "meter") {
      element.min = 0;
      element.max = 100;
      element.value = rand(0, 100);
    } else if (tag === "a") {
      element.href = "#";
      element.tabIndex = -1;
      element.textContent = choose(textBits);
    } else if (tag === "hr") {
      style.border = "0";
      style.borderTop = rand(1, 4).toFixed(1) + "px " + choose(["solid", "dashed", "dotted"]) + " " + border;
      style.height = "1px";
    } else if (tag === "table") {
      const row = document.createElement("tr");
      const cellA = document.createElement("td");
      const cellB = document.createElement("td");
      cellA.textContent = choose(textBits);
      cellB.textContent = choose(textBits);
      row.append(cellA, cellB);
      element.appendChild(row);
    } else if (tag === "ul" || tag === "ol" || tag === "menu") {
      const item = document.createElement("li");
      item.textContent = choose(textBits);
      element.appendChild(item);
    } else if (tag === "dl") {
      const term = document.createElement("dt");
      const definition = document.createElement("dd");
      term.textContent = choose(textBits);
      definition.textContent = choose(textBits);
      element.append(term, definition);
    } else if (tag === "fieldset") {
      const legend = document.createElement("legend");
      legend.textContent = choose(textBits);
      element.appendChild(legend);
    } else if (tag === "details") {
      const summary = document.createElement("summary");
      summary.textContent = choose(textBits);
      element.appendChild(summary);
      element.open = Math.random() < 0.5;
    } else if (tag === "form") {
      const button = document.createElement("button");
      button.type = "button";
      button.textContent = choose(textBits);
      element.appendChild(button);
    } else if (tag === "figure") {
      const caption = document.createElement("figcaption");
      caption.textContent = choose(textBits);
      element.appendChild(caption);
    } else if (tag === "ruby") {
      element.textContent = choose(["林", "猫", "夢", "夜", "月"]);
      const rubyText = document.createElement("rt");
      rubyText.textContent = choose(["ba", "neko", "yume", "tsuki"]);
      element.appendChild(rubyText);
    } else {
      element.textContent = choose(textBits);
    }

    const baseRotation = rand(-32, 32);
    const baseScale = rand(0.65, 1.28);
    const rotation = baseRotation.toFixed(2);
    const scale = baseScale.toFixed(3);
    style.transform = "translate(-50%, -50%) rotate(" + rotation + "deg) scale(" + scale + ")";
    return {
      element,
      x: x / frameWidth,
      y: y / frameHeight,
      width: width / frameWidth,
      height: height / frameHeight,
      baseRotation,
      baseScale,
      lastOpacity: -1,
      lastAngle: NaN,
      lastScale: NaN
    };
  }

  function resizeFrame() {
    if (!video.videoWidth || !video.videoHeight) return;
    const aspect = video.videoWidth / video.videoHeight;
    frameWidth = Math.max(1, Math.min(window.innerWidth, window.innerHeight * aspect));
    frameHeight = frameWidth / aspect;
    frame.style.width = frameWidth + "px";
    frame.style.height = frameHeight + "px";
    frame.style.aspectRatio = aspect;

    // About 600–700 items on desktop, rather than several thousand.
    const targetCount = clamp(Math.round((frameWidth * frameHeight) / 2100), 280, 680);
    const columns = Math.max(1, Math.round(Math.sqrt(targetCount * aspect)));
    const rows = Math.max(1, Math.ceil(targetCount / columns));
    const cellWidth = frameWidth / columns;
    const cellHeight = frameHeight / rows;

    sampleWidth = clamp(Math.round(frameWidth / 8), 96, 180);
    sampleHeight = Math.max(48, Math.round(sampleWidth / aspect));
    sampler.width = sampleWidth;
    sampler.height = sampleHeight;
    luminance = new Uint8Array(sampleWidth * sampleHeight);

    const fragment = document.createDocumentFragment();
    pieces = [];
    for (let row = 0; row < rows; row++) {
      for (let col = 0; col < columns; col++) {
        if (pieces.length >= targetCount) break;
        // Stratified random scattering keeps the screen well covered without
        // making a rigid grid. Size, color, tag and base angle are randomized.
        const x = (col + rand(0.08, 0.92)) * cellWidth;
        const y = (row + rand(0.08, 0.92)) * cellHeight;
        const piece = makeElement(choose(elementTags), x, y, cellWidth, cellHeight);
        pieces.push(piece);
        fragment.appendChild(piece.element);
      }
    }
    frame.replaceChildren(fragment);
    lastVideoTime = -1;
    renderFrame();
  }

  function detectForegroundPolarity(data) {
    // On a monochrome clip the larger background region decides the polarity.
    // This lets either black-on-white or white-on-black silhouettes work.
    let dark = 0;
    let bright = 0;
    for (let i = 0; i < data.length; i += 4) {
      const l = data[i] * 0.2126 + data[i + 1] * 0.7152 + data[i + 2] * 0.0722;
      if (l < 128) dark++;
      else bright++;
    }
    foregroundIsDark = dark < bright;
  }

  function renderFrame(force = false) {
    if (video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA ||
        !video.videoWidth || !pieces.length || !context) return;
    if (!force && lastVideoTime === video.currentTime) return;
    lastVideoTime = video.currentTime;

    try {
      context.drawImage(video, 0, 0, sampleWidth, sampleHeight);
      const rgba = context.getImageData(0, 0, sampleWidth, sampleHeight).data;
      for (let i = 0, p = 0; i < luminance.length; i++, p += 4) {
        luminance[i] = Math.round(rgba[p] * 0.2126 + rgba[p + 1] * 0.7152 + rgba[p + 2] * 0.0722);
      }

      const maxX = sampleWidth - 1;
      const maxY = sampleHeight - 1;
      const at = (x, y) => luminance[clamp(y, 0, maxY) * sampleWidth + clamp(x, 0, maxX)];
      for (const piece of pieces) {
        const sx = Math.round(piece.x * maxX);
        const sy = Math.round(piece.y * maxY);
        const rx = Math.max(1, Math.round(piece.width * sampleWidth * 0.28));
        const ry = Math.max(1, Math.round(piece.height * sampleHeight * 0.28));

        // Five-point coverage lets larger pieces straddle a silhouette edge.
        const points = [
          at(sx, sy),
          at(sx - rx, sy - ry),
          at(sx + rx, sy - ry),
          at(sx - rx, sy + ry),
          at(sx + rx, sy + ry)
        ];
        let coverage = 0;
        for (const l of points) {
          const fg = foregroundIsDark ? 255 - l : l;
          coverage += clamp((fg - 34) / 150, 0, 1);
        }
        coverage /= points.length;

        const gx = at(sx + 1, sy) - at(sx - 1, sy);
        const gy = at(sx, sy + 1) - at(sx, sy - 1);
        const gradient = Math.sqrt(gx * gx + gy * gy);

        // Only elements near a genuine contour are aligned to its tangent.
        // Elements in the flat silhouette interior keep their randomized angle.
        const edgeWeight = clamp((gradient - 24) / 100, 0, 1) * (1 - Math.abs(coverage * 2 - 1));
        const tangentAngle = Math.atan2(gy, gx) * 180 / Math.PI + 90;
        let angleDifference = ((tangentAngle - piece.baseRotation + 540) % 360) - 180;
        const angle = piece.baseRotation + angleDifference * edgeWeight;

        // Random base dimensions stay varied; the mask gently scales them at
        // edges so they fit the silhouette instead of appearing as a rigid grid.
        const edgeScale = 1 - edgeWeight * 0.24;
        const scale = piece.baseScale * (0.78 + coverage * 0.32) * edgeScale;
        const opacity = coverage < 0.11 ? 0 : clamp(coverage * 1.12, 0, 0.94);
        const element = piece.element;

        if (Math.abs(opacity - piece.lastOpacity) > 0.018) {
          element.style.opacity = opacity.toFixed(3);
          piece.lastOpacity = opacity;
        }
        if (!Number.isFinite(piece.lastAngle) ||
            Math.abs(angle - piece.lastAngle) > 1.8 ||
            Math.abs(scale - piece.lastScale) > 0.025) {
          element.style.transform =
            "translate(-50%, -50%) rotate(" + angle.toFixed(1) + "deg) scale(" + scale.toFixed(3) + ")";
          piece.lastAngle = angle;
          piece.lastScale = scale;
        }
      }
    } catch (error) {
      console.error("Could not sample video frame:", error);
    }
  }

  function stopAnimation() { animationToken++; }
  function animate() {
    stopAnimation();
    const token = animationToken;
    if (typeof video.requestVideoFrameCallback === "function") {
      const next = () => {
        if (token !== animationToken || video.paused || video.ended) return;
        renderFrame();
        video.requestVideoFrameCallback(next);
      };
      video.requestVideoFrameCallback(next);
    } else {
      const next = () => {
        if (token !== animationToken || video.paused || video.ended) return;
        renderFrame();
        requestAnimationFrame(next);
      };
      requestAnimationFrame(next);
    }
  }

  async function beginAutomatically() {
    if (started) return;
    started = true;
    video.muted = false;
    video.volume = 1;
    try {
      await video.play();
      hideGate();
      animate();
    } catch (_) {
      // Audio autoplay may be blocked: start the visuals muted, then offer sound.
      video.muted = true;
      try {
        await video.play();
        animate();
        showGate("🔊 Ton aktivieren");
      } catch (_) {
        showGate("▶ Start Bad Apple mit Ton");
      }
    }
  }

  startButton.addEventListener("click", async () => {
    if (startButton.disabled) return;
    video.muted = false;
    video.volume = 1;
    try {
      await video.play();
      hideGate();
      animate();
    } catch (error) {
      startButton.textContent = "▶ Wiedergabe starten";
      console.warn("Playback still blocked:", error);
    }
  });

  video.addEventListener("error", () => {
    if (sourceIndex < videoFiles.length) loadNextVideo();
    else {
      missing.style.display = "block";
      showGate("Videodatei fehlt");
      startButton.disabled = true;
    }
  });
  video.addEventListener("loadedmetadata", () => {
    missing.style.display = "none";
    resizeFrame();
    beginAutomatically();
  });
  video.addEventListener("loadeddata", () => {
    try {
      context.drawImage(video, 0, 0, sampleWidth || 128, sampleHeight || 72);
      detectForegroundPolarity(context.getImageData(0, 0, sampleWidth || 128, sampleHeight || 72).data);
    } catch (_) {
      // Keep the default dark-foreground interpretation if sampling fails.
    }
    renderFrame(true);
  });
  video.addEventListener("play", animate);
  video.addEventListener("seeked", () => { lastVideoTime = -1; renderFrame(true); });
  video.addEventListener("timeupdate", renderFrame);
  video.addEventListener("ended", () => { lastVideoTime = -1; renderFrame(true); });
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(resizeFrame, 100);
  });

  loadNextVideo();
})();
</script>
</body>
</html>
