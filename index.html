<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Bad Apple — Random</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#000; }
    #page { display:block; width:100%; height:100%; border:0; background:#000; }
  </style>
</head>
<body>
  <iframe id="page" title="Zufällige Bad Apple Seite" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script>
(() => {
  "use strict";

  // Explizite Liste der HTML-Varianten im Repository.
  // So ist die Auswahl unabhängig von API-Limits oder GitHub-Dateilisten.
  const pages = [
    "badapple-elements.html",
    "badapple-constellation.html"
  ];
  const frame = document.getElementById("page");
  const storageKey = "badApplePageIndexV3";

  function readPrevious() {
    try {
      return sessionStorage.getItem(storageKey) || localStorage.getItem(storageKey) || "";
    } catch (_) {
      try { return localStorage.getItem(storageKey) || ""; } catch (_) { return ""; }
    }
  }

  function remember(path) {
    try { sessionStorage.setItem(storageKey, path); } catch (_) {}
    try { localStorage.setItem(storageKey, path); } catch (_) {}
  }

  function randomIndex(length) {
    if (window.crypto && window.crypto.getRandomValues) {
      const value = new Uint32Array(1);
      window.crypto.getRandomValues(value);
      return value[0] % length;
    }
    return Math.floor(Math.random() * length);
  }

  // Choose randomly from every available page, and avoid repeating the previous
  // choice so refreshes visibly cycle to another design.
  const previous = readPrevious();
  let choices = pages.filter(path => path !== previous);
  if (choices.length === 0) choices = pages;
  const selected = choices[randomIndex(choices.length)];
  remember(selected);

  // Keep the address at index.html and bypass a cached copy of the chosen page.
  frame.src = selected + "?v=" + Date.now().toString(36) + "-" + randomIndex(0x7fffffff).toString(36);
})();
</script>
</body>
</html>
