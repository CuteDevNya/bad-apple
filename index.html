<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000">
<title>Bad Apple — Random</title>
<style>
  html,body { width:100%;height:100%;margin:0;overflow:hidden;background:#000; }
  #page { display:block;width:100%;height:100%;border:0;background:#000; }
</style>
</head>
<body>
<iframe id="page" title="Bad Apple" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script>
(() => {
  "use strict";
  // Only keep genuinely different experiences in the rotation.
  const pages = [
    "badapple-elements.html",
    "badapple-constellation.html"
  ];
  const key = "badAppleShuffleV6";
  const frame = document.getElementById("page");
  let previous = "";
  try { previous = localStorage.getItem(key) || ""; } catch (_) {}

  // Randomly choose any page except the immediately previous one.
  let choices = pages.filter(path => path !== previous);
  if (choices.length === 0) choices = pages;
  let n;
  if (window.crypto && window.crypto.getRandomValues) {
    const seed = new Uint32Array(1);
    window.crypto.getRandomValues(seed);
    n = seed[0] % choices.length;
  } else {
    n = Math.floor(Math.random() * choices.length);
  }
  const selected = choices[n];
  try { localStorage.setItem(key, selected); } catch (_) {}

  frame.src = selected + "?v=" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2);
})();
</script>
</body>
</html>
