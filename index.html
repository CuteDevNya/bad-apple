<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050505">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>Bad Apple — Zufallsseite</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#050505; }
    #page { display:block; width:100%; height:100%; border:0; background:#050505; }
  </style>
</head>
<body>
  <iframe id="page" title="Zufällige Bad Apple Seite" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script>
(() => {
  "use strict";
  const pages = [
    "badapple-elements.html",
    "badapple-fragment-bloom.html"
  ];
  const frame = document.getElementById("page");
  const storageKey = "badAppleLastPageV2";

  function getPrevious() {
    try {
      return sessionStorage.getItem(storageKey) ||
             localStorage.getItem(storageKey) || "";
    } catch (_) {
      try { return localStorage.getItem(storageKey) || ""; } catch (_) { return ""; }
    }
  }

  function remember(path) {
    try { sessionStorage.setItem(storageKey, path); } catch (_) {}
    try { localStorage.setItem(storageKey, path); } catch (_) {}
  }

  // Two live variants: avoid repeating the same page on consecutive reloads.
  const previous = getPrevious();
  let candidates = pages.filter(path => path !== previous);
  if (!candidates.length) candidates = pages;
  const selected = candidates[Math.floor(Math.random() * candidates.length)];
  remember(selected);

  // Keep the address on index.html and bypass a stale cached iframe document.
  const url = selected.split("/").map(encodeURIComponent).join("/");
  frame.src = url + "?refresh=" + Date.now();
})();
</script>
</body>
</html>
