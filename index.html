<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#050505">
  <title>Bad Apple — Zufallsseite</title>
  <style>
    html, body { width:100%; height:100%; margin:0; overflow:hidden; background:#050505; }
    #page { display:block; width:100%; height:100%; border:0; }
  </style>
</head>
<body>
  <iframe id="page" title="Zufällige Bad Apple Seite" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script>
(async () => {
  const fallbackPage = "badapple-elements.html";
  const frame = document.getElementById("page");

  function loadPage(path) {
    // Den Index im Browser geöffnet lassen, damit Neuladen erneut auswählt.
    frame.src = path.split("/").map(encodeURIComponent).join("/");
  }

  try {
    const response = await fetch(
      "https://api.github.com/repos/CuteDevNya/bad-apple/git/trees/main?recursive=1",
      { headers: { Accept: "application/vnd.github+json" }, cache: "no-store" }
    );
    if (!response.ok) throw new Error("GitHub API antwortete mit " + response.status);

    const result = await response.json();
    const pages = (result.tree || [])
      .filter(item =>
        item.type === "blob" &&
        /\.html?$/i.test(item.path) &&
        item.path.toLowerCase() !== "index.html"
      )
      .map(item => item.path);

    if (!pages.length) throw new Error("Keine auswählbaren HTML-Seiten gefunden");

    // Beim Neuladen eine andere Variante wählen, wenn mehrere existieren.
    let previous = "";
    try { previous = sessionStorage.getItem("badAppleLastPage") || ""; } catch (_) {}
    let choices = pages.length > 1 ? pages.filter(path => path !== previous) : pages;
    if (!choices.length) choices = pages;
    const selectedPage = choices[Math.floor(Math.random() * choices.length)];
    try { sessionStorage.setItem("badAppleLastPage", selectedPage); } catch (_) {}
    loadPage(selectedPage);
  } catch (error) {
    loadPage(fallbackPage);
  }
})();
</script>
</body>
</html>
